# ------------------------------------------------------------------
# Trae de la planilla los valores de la UMA y del UHOM y los commitea
# si cambiaron.
#
# La planilla la lee este workflow, no el navegador del visitante: la
# app declara que nada de lo que se escribe sale del navegador, y con
# un fetch a Google en cada carga esa afirmacion dependia de Google.
# El porque completo esta en lib/legal/uma.ts y en lib/legal/uhom.ts.
#
# El push a main dispara Deploy Pages, asi que el sitio queda con los
# valores nuevos sin que nadie toque nada.
#
# El cron corre todos los dias. Corria los dias 1 y 15, con el
# razonamiento de que dos pasadas alcanzaban para que nunca pasara mas
# de dos semanas desactualizada. Dos semanas resultaron ser mucho: el
# 20/8/26 la Res. SGA n° 1930/26 entro en la planilla, la pasada del 15
# ya habia pasado y la siguiente caia el 1 de septiembre. Doce dias de
# sitio calculando con la UMA vieja, en una app cuyos numeros pueden
# terminar fundando una regulacion judicial. Una pasada diaria cuesta
# un minuto de runner y acota ese error a un dia.
#
# Al UHOM la cadencia le sirve igual: cambia todos los meses y rige
# desde el dia 1, asi que la pasada del 1 lo toma el mismo dia.
#
# El disparo manual queda, y es el camino cuando hay apuro: Actions ->
# "UMA y UHOM" -> "Run workflow". Va de la planilla al sitio publicado
# sin esperar al cron.
#
# Si la planilla no responde, o trae algo que no pasa los controles,
# el script falla y no toca ningun archivo. Publicar con el valor de
# ayer es mejor que publicar con uno inventado.
# ------------------------------------------------------------------
name: UMA y UHOM

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 en Buenos Aires
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uma
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Traer los valores de la planilla
        run: node scripts/actualizar-uma.mjs

      - name: Commitear si cambio
        run: |
          if git diff --quiet -- data/uma.json data/uhom.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uma.json data/uhom.json
          git commit -m "chore: actualizar los valores de la UMA y el UHOM"
          git push
